<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#161b26;--mu:#667085;--bd:#dde2ec;--buy:#12a05c;--sell:#e0383e;--wait:#d98a00;--ac:#2563eb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1117;--card:#161b26;--tx:#e8ecf4;--mu:#98a2b3;--bd:#2a3244;--buy:#2ecc8a;--sell:#ff6169;--wait:#f5b942;--ac:#5b8def}}
:root[data-theme="dark"]{--bg:#0d1117;--card:#161b26;--tx:#e8ecf4;--mu:#98a2b3;--bd:#2a3244;--buy:#2ecc8a;--sell:#ff6169;--wait:#f5b942;--ac:#5b8def}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans Khmer","Khmer OS",system-ui,sans-serif;line-height:1.6}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:4px 0}
p.s{color:var(--mu);margin:0 0 14px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
#drop{position:relative;display:block;border:2px dashed var(--bd);border-radius:12px;padding:26px 12px;text-align:center;color:var(--mu);cursor:pointer}
#prev{max-width:100%;border-radius:10px;display:none;margin-top:10px}
button{width:100%;padding:13px;border:0;border-radius:12px;background:var(--ac);color:#fff;font-size:1rem;font-family:inherit;cursor:pointer}
button:disabled{opacity:.5}
select,input[type=text]{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-family:inherit;font-size:.95rem;margin-bottom:8px}
.sig{text-align:center;font-size:1.8rem;font-weight:700;padding:12px;border-radius:12px}
.BUY{background:color-mix(in srgb,var(--buy) 18%,transparent);color:var(--buy)}
.SELL{background:color-mix(in srgb,var(--sell) 18%,transparent);color:var(--sell)}
.WAIT{background:color-mix(in srgb,var(--wait) 18%,transparent);color:var(--wait)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.grid div{border:1px solid var(--bd);border-radius:10px;padding:8px 10px}
.grid small{display:block;color:var(--mu)}
.grid b{font-size:1.05rem}
h3{margin:0 0 6px;font-size:1rem}
ul{margin:0;padding-left:20px}
.forbid{border-color:var(--sell)}.alert{border-color:var(--wait)}.tBUY{color:var(--buy)}.tSELL{color:var(--sell)}.grid{margin-bottom:6px}.w{color:var(--mu);font-size:.8rem}
#err{color:var(--sell);display:none;margin-top:8px}
.grid{grid-template-columns:repeat(3,1fr)}.sig.sm{font-size:1.15rem;padding:8px;margin-bottom:10px}
.barrow{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:.9rem}.barrow>span{width:36px}.barrow .pct{width:40px;text-align:right}
.track{flex:1;height:8px;border-radius:6px;background:var(--bd);overflow:hidden}.fill{height:100%}.fill.up{background:var(--buy)}.fill.dn{background:var(--sell)}
.tabs{display:flex;gap:8px;margin-bottom:8px}.tabs button{padding:8px;background:var(--bg);color:var(--tx);border:1px solid var(--bd)}.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{margin-bottom:10px}.forbid li,.alert li{margin:3px 0}
.badge{display:inline-block;padding:3px 10px;border-radius:8px;font-weight:700;font-size:.85rem;margin-bottom:8px}.badge.BUY{background:color-mix(in srgb,var(--buy) 18%,transparent);color:var(--buy)}.badge.SELL{background:color-mix(in srgb,var(--sell) 18%,transparent);color:var(--sell)}.scalp{border-width:2px}.scalp.sBUY{border-color:var(--buy)}.scalp.sSELL{border-color:var(--sell)}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.two label{font-size:.8rem;color:var(--mu);display:block}.two input{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-family:inherit;font-size:.95rem;margin-bottom:8px}.note{color:var(--mu);font-size:.85rem;margin:8px 0 0}
.loss{margin-top:8px;padding:8px 10px;border-radius:10px;border:1px solid var(--sell);color:var(--sell);font-size:.9rem}
</style>

<body>
<main>
<h1>📈 AI វិភាគឆាត Forex</h1>
<p class="s">ដាក់រូបឆាត (screenshot) រួច AI នឹងប្រាប់ចំណុចចូល Buy/Sell, TP និង SL</p>

<div class="card">
  <label id="drop"><span id="dropt">📷 ចុចទីនេះដើម្បីជ្រើសរូបឆាត</span><input id="file" type="file" accept="image/*" style="position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0"></label>
  <img id="prev" alt="chart">
  <div style="margin-top:12px">
    <select id="style">
      <option value="quick" selected>💰 ចំណេញតូចៗ (ទិញ + លក់ មិនបាច់រង់ចាំឡើង/ចុះខ្លាំង)</option>
      <option value="scalping">Scalping (M1–M15)</option>
      <option value="intraday">Intraday (M15–H1)</option>
      <option value="swing">Swing (H4–D1)</option>
    </select>
    <div class="two">
      <div><label for="lot">Lot</label><input id="lot" type="number" step="0.01" min="0.01" value="0.1"></div>
      <div><label for="tgt">គោលដៅចំណេញ ($)</label><input id="tgt" type="number" step="0.5" min="0.5" value="2"></div>
    </div>
    <input id="key" type="text" placeholder="Anthropic API key (sk-ant-...)" autocomplete="off">
    <input id="note" type="text" placeholder="កំណត់សម្គាល់ (ជម្រើស) ឧ. ហានិភ័យ 1%, balance $500">
    <button id="go" disabled>🔍 វិភាគឥឡូវនេះ</button>
    <div id="err"></div>
  </div>
</div>

<div id="out"></div>
<p class="w">⚠️ នេះជាការវិភាគជំនួយប៉ុណ្ណោះ មិនមែនជាដំបូន្មានហិរញ្ញវត្ថុ ឬការធានាប្រាក់ចំណេញទេ។ Forex មានហានិភ័យខ្ពស់ សូមសាកល្បងលើ demo និងកំណត់ហានិភ័យ 1–2% ក្នុងមួយ trade។</p>
</main>

<script>
const $=id=>document.getElementById(id);
let blob=null, sample=null;
try{window.addEventListener('DOMContentLoaded',()=>{$('key').value=localStorage.getItem('akey')||''})}catch(_){}
function b64(b){return new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(',')[1]);f.readAsDataURL(b)})}
async function ask(key,text,img){
  const data=await b64(img);
  const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
    headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-sonnet-5-5',max_tokens:2500,messages:[{role:'user',content:[
      {type:'image',source:{type:'base64',media_type:img.type||'image/jpeg',data}},{type:'text',text}]}]})});
  const j=await res.json(); if(!res.ok) throw new Error((j.error&&j.error.message)||'API error');
  return {text:j.content.map(c=>c.text||'').join('')};
}
async function setImage(f){
  if(!f) return;
  try{blob=await shrink(f);}catch(_){blob=f;}
  $('prev').src=URL.createObjectURL(blob); $('prev').style.display='block';
  $('dropt').textContent='✅ ជ្រើសរូបរួច (ចុចដើម្បីប្តូរ)';
  $('go').disabled=false;
}
$('file').addEventListener('change',e=>setImage(e.target.files&&e.target.files[0]));
document.addEventListener('paste',e=>{
  const it=[...(e.clipboardData&&e.clipboardData.items||[])].find(i=>i.type.startsWith('image/'));
  if(it) setImage(it.getAsFile());
});
function shrink(f){
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{
      const m=1600, k=Math.min(1,m/Math.max(img.width,img.height));
      const c=document.createElement('canvas');
      c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      c.toBlob(b=>res(b||f),'image/jpeg',0.9);
    };
    img.onerror=()=>res(f);
    img.src=URL.createObjectURL(f);
  });
}

function prompt_(){
  return `អ្នកគឺជាអ្នកវិភាគ Forex អាជីព។ មើលរូបឆាត candlestick ហើយអានគូប្រាក់ timeframe តម្លៃបច្ចុប្បន្ន និងស្កេលតម្លៃ (ចំណាំតម្លៃ 2 ចំណុចដើម្បីគណនា pip/ATR)។
វិភាគក្នុងចិត្ត៖ market structure (HH/HL, LH/LL, BOS/CHoCH), Support/Resistance, supply/demand, liquidity sweep, candle pattern, momentum, confluence score 0-10។
រចនាបថ: ${$('style').value}. កំណត់សម្គាល់: ${$('note').value||'គ្មាន'}.
ច្បាប់៖ ប្រើតែតម្លៃពីស្កេលក្នុងរូប។ SL នៅក្រោម/លើ structure បូកចន្លោះ spread, TP នៅមុន S/R ខាងមុខ, RR ≥ 1:1.5។ BUY: SL<entry<TP; SELL: SL>entry>TP។ Entry ជិតតម្លៃបច្ចុប្បន្ន (limit/pullback)។ ក្នុងរចនាបថ quick ផ្តោត TP តូចៗ ហើយជ្រើសផ្នែកដែលល្អជាង; WAIT តែពេលចលនាច្របូកច្របល់ពិតប្រាកដ។ កុំបំផ្លើសទំនុកចិត្ត។
ផ្តល់ផែនការទាំង BUY និង SELL។ "big" = ព្យាករណ៍ចលនាខ្លាំង (ប្រហែល ≥2×ATR ក្នុង 1-2 ម៉ោងខាងមុខ) ពី compression/squeeze, ជិត breakout, liquidity sweep, momentum: ផ្តល់សេណារីយ៉ូទាំង up និង down ជានិច្ច ម្នាក់ៗមាន prob % (ផលបូក ≤100), trigger=តម្លៃបែកដែលបញ្ជាក់, target=គោលដៅ, sl=ចំណុចខុស; dir=សេណារីយ៉ូដែលទំនងជាង (UP/DOWN/NONE)។ ប្រភេទ order: BUY LIMIT = entry ក្រោមតម្លៃបច្ចុប្បន្ន, SELL LIMIT = entry លើតម្លៃបច្ចុប្បន្ន, BUY STOP = entry លើតម្លៃ, SELL STOP = entry ក្រោមតម្លៃ, ឬ MARKET បើចូលភ្លាម; type ត្រូវស្របនឹង entry ធៀបតម្លៃបច្ចុប្បន្ន។ loss = តម្លៃដែលប្រសិនបើដល់ហើយនឹងខាត (ស្មើ SL), loss_pips = ចំនួន pip ហានិភ័យពី entry, ត្រូវតម្លៃពីស្កេលរូប។ "scalp" = ចូលភ្លាមៗ (MARKET) នៅតម្លៃបច្ចុប្បន្នពិតប្រាកដ (ប្រើ SELL/BUY price ខាងលើឆាតបើមាន; SELL ចូលនៅ bid, BUY ចូលនៅ ask) ដើម្បីចំណេញខ្លីៗ ទោះមិនមែនចំណុច limit ល្អបំផុត។ ជ្រើសទិសដៅតាម momentum/candle 3-6 ចុងក្រោយ និង S/R ជិតបំផុត (កុំចូលប្រឆាំងជញ្ជាំង S/R ជិត)។ lot=${$('lot').value||0.1}, គោលដៅចំណេញ=$${$('tgt').value||2}។ គណនាតម្លៃ pip ពី pair និង lot រួច TP = ចំនួន pip ដែលគ្រប់សម្រាប់ចំណេញគោលដៅ (បូក spread) ហើយ TP ត្រូវនៅមុន S/R ខាងមុខ; បើមិនគ្រប់ ឱ្យតូចជាងគោលដៅ ហើយសរសេរក្នុង why។ SL នៅខាងក្រោយ structure ជិត ឱ្យតូចបំផុតតាមដែលអាច។ BUY: SL<entry<TP; SELL: SL>entry>TP។ hold=រយៈពេលរំពឹង (នាទី)។ why ≤12 ពាក្យ។ មិនត្រូវទុកទទេ ត្រូវតែជ្រើស BUY ឬ SELL។\n"forbid" = 2-4 ការហាមចូល trade ឥឡូវនេះ ជាក់លាក់ (ឧ. ជិត Resistance, candle មិនទាន់បិទ, ប្រឆាំង trend) ម្នាក់ ≤10 ពាក្យ។ "alert" = 2-3 ការប្រាប់មុន ជាមួយតម្លៃ trigger ទម្រង់ "បើ ... → ..." ម្នាក់ ≤12 ពាក្យ។ មិនមានអត្ថបទពន្យល់ផ្សេងទៀតទេ។
ឆ្លើយតែ JSON មួយ គ្មាន markdown (ខ្មែរ):
{"pair":"","timeframe":"","price":"","signal":"BUY|SELL|WAIT","confidence":0-100,"score":0-10,"entry":"","sl":"","tp1":"","tp2":"","rr":"","buy":{"type":"BUY LIMIT|BUY STOP|BUY MARKET","entry":"","sl":"","tp1":"","tp2":"","loss":"","loss_pips":""},"sell":{"type":"SELL LIMIT|SELL STOP|SELL MARKET","entry":"","sl":"","tp1":"","tp2":"","loss":"","loss_pips":""},"big":{"dir":"UP|DOWN|NONE","up":{"prob":0-100,"trigger":"","target":"","sl":""},"down":{"prob":0-100,"trigger":"","target":"","sl":""}},"scalp":{"dir":"BUY|SELL","entry":"","tp":"","sl":"","tp_pips":"","sl_pips":"","profit_usd":"","loss_usd":"","hold":"","why":""},"forbid":["..."],"alert":["..."]}`;
}

function review_(a){
  return `អ្នកគឺជាអ្នកត្រួតពិនិត្យហានិភ័យដ៏តឹងរឹង។ ការវិភាគ៖\n${JSON.stringify(a)}\nមើលរូបម្តងទៀត ហើយពិនិត្យ៖ (1) តម្លៃ entry/SL/TP ត្រូវនឹងស្កេលរូប? (2) ទិសដៅ SL/TP ត្រឹមត្រូវ (BUY: SL<entry<TP, SELL ផ្ទុយ)? (3) RR ត្រឹមត្រូវ? (4) SL ក្រៅ noise, TP មិនជាប់ S/R ខាងមុខ? (5) signal ស្របនឹងរចនាសម្ព័ន្ធ? (6) scalp: entry ជិតតម្លៃបច្ចុប្បន្ន, TP/SL ត្រូវទិសដៅ, TP មិនជាប់ S/R ជិត? កែកំហុសទាំងអស់ បន្ថយ confidence បើមិនច្បាស់ ហើយប្តូរទៅ WAIT បើកំហុសធ្ងន់។ ឆ្លើយ JSON ដដែលតាម key ដើម គ្មាន markdown។`;
}

function parse(t){
  t=t.replace(/```json|```/g,'').trim();
  const a=t.indexOf('{'), b=t.lastIndexOf('}');
  return JSON.parse(t.slice(a,b+1));
}

function el(tag,cls,txt){const e=document.createElement(tag); if(cls)e.className=cls; if(txt!=null)e.textContent=txt; return e;}
function levels(keys){
  const g=el('div','grid');
  keys.forEach(([k,v])=>{const d=el('div'); d.appendChild(el('small',0,k)); d.appendChild(el('b',0,v||'-')); g.appendChild(d);});
  return g;
}
function card(title){const c=el('div','card'); if(title) c.appendChild(el('h3',0,title)); return c;}
function bar(label,pct,cls){
  const n=Math.max(0,Math.min(100,+pct||0));
  const w=el('div','barrow'); w.appendChild(el('span',0,label));
  const t=el('div','track'); const f=el('div','fill '+cls); f.style.width=n+'%'; t.appendChild(f); w.appendChild(t);
  w.appendChild(el('span','pct',n+'%')); return w;
}

const num=v=>parseFloat(String(v==null?'':v).replace(/[^0-9.\-]/g,''));
function scalpCard(r){
  const p=r.scalp; if(!p||!['BUY','SELL'].includes(p.dir)) return null;
  const k=card('⚡ ចំណេញខ្លីៗ · ចូលភ្លាម'); k.classList.add('scalp','s'+p.dir);
  k.appendChild(el('div','badge '+p.dir,p.dir+' MARKET'));
  k.appendChild(levels([['Entry',p.entry],['TP',p.tp],['SL',p.sl]]));
  const e=num(p.entry),tp=num(p.tp),sl=num(p.sl);
  const ok=[e,tp,sl].every(isFinite)&&(p.dir==='BUY'?(sl<e&&e<tp):(sl>e&&e>tp));
  if(!ok){k.appendChild(el('div','loss','⚠️ តម្លៃ TP/SL មិនស្របទិសដៅ — កុំប្រើ trade នេះ'));return k;}
  const pair=String(r.pair||'').replace(/[^A-Za-z]/g,'').toUpperCase();
  const pip=pair.includes('JPY')?0.01:pair.includes('XAU')?0.1:0.0001;
  const tpP=Math.abs(tp-e)/pip, slP=Math.abs(sl-e)/pip;
  const lot=num($('lot').value)||0.1;
  const usdOk=/^[A-Z]{3}USD$/.test(pair)&&!pair.startsWith('XAU');
  const pv=lot*10;
  const win=usdOk?'$'+(tpP*pv).toFixed(2):(p.profit_usd||'-');
  const lose=usdOk?'$'+(slP*pv).toFixed(2):(p.loss_usd||'-');
  const be=Math.round(slP/(tpP+slP)*100);
  k.appendChild(levels([['TP pips',tpP.toFixed(1)],['SL pips',slP.toFixed(1)],['RR','1:'+(tpP/slP).toFixed(2)],['ចំណេញ ≈',win],['ខាត ≈',lose],['ត្រូវឈ្នះ ≥',be+'%']]));
  if(be>=60) k.appendChild(el('div','loss','⚠️ SL ធំជាង TP ខ្លាំង — ត្រូវឈ្នះ '+be+'% ឡើងទើបមិនខាត (មិនទាន់រួម spread)។ បន្ថយ SL ឬកុំចូល។'));
  const t=[p.hold?'រយៈពេល៖ '+p.hold:'',p.why||''].filter(Boolean).join(' · ');
  if(t) k.appendChild(el('p','note',t));
  return k;
}
function render(r){
  const o=$('out'); o.textContent='';
  const s=['BUY','SELL','WAIT'].includes(r.signal)?r.signal:'WAIT';
  const lbl={BUY:'🟢 BUY ទិញ',SELL:'🔴 SELL លក់',WAIT:'🟡 WAIT រង់ចាំ'}[s];

  // 1. ទិសដៅ
  const c=card();
  c.appendChild(el('div','sig '+s,lbl));
  c.appendChild(el('p','s',`${r.pair||''} · ${r.timeframe||''} · ${r.price||''} · ទំនុកចិត្ត ${r.confidence??'-'}%`));
  if(s!=='WAIT') c.appendChild(levels([['Entry',r.entry],['SL',r.sl],['TP1',r.tp1],['TP2',r.tp2],['RR',r.rr],['Score',(r.score??'-')+'/10']]));
  o.appendChild(c);
  const sc=scalpCard(r); if(sc) o.appendChild(sc);

  // 2. ចលនាខ្លាំង (ឡើង + ចុះ ជាមួយគ្នា)
  const b=r.big;
  if(b&&(b.up||b.down)){
    const up=b.up||{}, dn=b.down||{};
    const k=card('ចលនាខ្លាំងខាងមុខ');
    k.appendChild(bar('ឡើង'+(b.dir==='UP'?' ⭐':''),up.prob,'up'));
    k.appendChild(bar('ចុះ'+(b.dir==='DOWN'?' ⭐':''),dn.prob,'dn'));
    const tabs=el('div','tabs'), body=el('div');
    const show=side=>{
      body.textContent=''; const p=side==='up'?up:dn;
      body.appendChild(levels([['បែកកម្រិត',p.trigger],['គោលដៅ',p.target],['SL',p.sl]]));
      tabs.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.k===side));
    };
    [['up','🚀 ឡើងខ្លាំង'],['down','💥 ចុះខ្លាំង']].forEach(([id,t])=>{
      const x=el('button',0,t); x.dataset.k=id; x.onclick=()=>show(id); tabs.appendChild(x);
    });
    k.appendChild(tabs); k.appendChild(body); o.appendChild(k);
    show(b.dir==='DOWN'?'down':'up');
  }

  // 3. ផែនការ BUY / SELL
  if(r.buy||r.sell){
    const k=card('ផែនការ'); const tabs=el('div','tabs'); const body=el('div');
    const show=side=>{
      body.textContent=''; const p=side==='BUY'?r.buy:r.sell; if(!p) return;
      body.appendChild(el('div','badge '+side,p.type||(side+' LIMIT')));
      body.appendChild(levels([['Entry',p.entry],['SL',p.sl],['TP1',p.tp1],['TP2',p.tp2]]));
      const pips=p.loss_pips?` (−${p.loss_pips} pips)`:'';
      body.appendChild(el('div','loss',side==='BUY'
        ?`⚠️ ធ្លាក់ដល់ ${p.loss||p.sl||'-'} → ខាត${pips}`
        :`⚠️ ឡើងដល់ ${p.loss||p.sl||'-'} → ខាត${pips}`));
      tabs.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.k===side));
    };
    [['BUY','🟢 BUY'],['SELL','🔴 SELL']].forEach(([id,t])=>{
      const x=el('button',0,t); x.dataset.k=id; x.onclick=()=>show(id); tabs.appendChild(x);
    });
    k.appendChild(tabs); k.appendChild(body); o.appendChild(k);
    show(s==='SELL'?'SELL':'BUY');
  }

  // 4. ហាមចូល + ប្រាប់មុន
  [['⛔ ហាមចូល',r.forbid,'forbid'],['⚡ ប្រាប់មុន',r.alert,'alert']].forEach(([t,arr,cl])=>{
    if(!arr||!arr.length) return;
    const k=card(t); k.classList.add(cl);
    const u=el('ul'); arr.forEach(x=>u.appendChild(el('li',0,x))); k.appendChild(u); o.appendChild(k);
  });
}

$('go').onclick=async()=>{
  const err=$('err'); err.style.display='none';
  $('go').disabled=true; $('go').textContent='⏳ កំពុងវិភាគ...';
  try{
    const key=$('key').value.trim(); if(!key) throw new Error('សូមបញ្ចូល API key');
    localStorage.setItem('akey',key);
    sample=(t,o)=>ask(key,t,o.images[0]);
    const r=await sample(prompt_(),{images:[blob],modelTier:'complex',cache:false});
    let a=parse(r.text);
    $('go').textContent='🔎 កំពុងត្រួតពិនិត្យលើកទី២...';
    try{const r2=await sample(review_(a),{images:[blob],modelTier:'complex',cache:false}); a=parse(r2.text);}catch(_){}
    render(a);
  }catch(e){
    err.textContent='កំហុស: '+(e.message||e.code||'មិនស្គាល់');
    err.style.display='block';
  }
  $('go').disabled=false; $('go').textContent='🔍 វិភាគឥឡូវនេះ';
};
